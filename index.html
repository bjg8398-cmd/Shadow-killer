<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Killer</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090b12;
  color: white;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 42px;
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

.card {
  background: #151925;
  border-radius: 18px;
  padding: 22px;
  margin: 15px 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #444;
  background: #0d1018;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  background: #6c4cff;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  opacity: .4;
}

.hidden {
  display: none;
}

.role {
  font-size: 30px;
  font-weight: bold;
  margin: 20px 0;
}

.bad {
  color: #ff4d5a;
}

.good {
  color: #4cff9b;
}

.special {
  color: #ffd166;
}

.info {
  color: #aaa;
  line-height: 1.6;
}

.player {
  background: #202535;
  padding: 12px;
  margin: 7px 0;
  border-radius: 10px;
}

.target {
  background: #292f42;
  cursor: pointer;
}

.target:hover {
  background: #3a4055;
}

.selected {
  outline: 2px solid #6c4cff;
}

#log {
  text-align: left;
  max-height: 220px;
  overflow-y: auto;
  background: #0d1018;
  padding: 12px;
  border-radius: 10px;
}

hr {
  border: 0;
  border-top: 1px solid #333;
}
</style>
</head>

<body>

<div class="container">

<h1>🌑 Shadow Killer</h1>
<div class="subtitle">Trust no one.</div>

<!-- START SCREEN -->
<div id="startScreen" class="card">

<h2>Create Game</h2>

<input id="playerName" placeholder="Your name">

<input
  id="playerCount"
  type="number"
  min="7"
  max="20"
  value="8"
  placeholder="Number of players">

<button onclick="startGame()">START GAME</button>

<p class="info">
Minimum 7 players<br>
🔪 3 Killers • 🔎 Detective • 🩺 Doctor<br>
🤡 Fool • ⚔️ Challenger • 👤 Innocents
</p>

</div>

<!-- ROLE SCREEN -->
<div id="roleScreen" class="card hidden">

<h2>Your Secret Role</h2>

<div id="role" class="role"></div>

<div id="roleDescription" class="info"></div>

<button onclick="showGame()">Continue</button>

</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="hidden">

<div class="card">

<h2 id="phaseTitle">🌙 Night Phase</h2>

<p id="phaseText"></p>

</div>

<div id="actionCard" class="card hidden">

<h3 id="actionTitle"></h3>

<p id="actionText" class="info"></p>

<div id="actionTargets"></div>

<button id="actionButton" onclick="confirmAction()">
Confirm
</button>

</div>

<div class="card">

<h3>Players</h3>

<div id="players"></div>

</div>

<div class="card">

<h3>Game Log</h3>

<div id="log"></div>

</div>

</div>

</div>

<script>

let players = [];
let myRole = "";
let phase = "night";
let selectedTarget = null;
let doctorSaveUsed = false;
let doctorKillUsed = false;

/*
  FIXED SPECIAL ROLES

  3 Killers
  1 Detective
  1 Doctor
  1 Fool
  1 Challenger

  Everyone else = Innocent
*/

const fixedRoles = [
  "Killer",
  "Killer",
  "Killer",
  "Detective",
  "Doctor",
  "Fool",
  "Challenger"
];

function startGame() {

  const name =
    document.getElementById("playerName").value.trim();

  const count =
    parseInt(document.getElementById("playerCount").value);

  if (!name) {
    alert("Enter your name first.");
    return;
  }

  if (count < 7 || count > 20) {
    alert("Choose between 7 and 20 players.");
    return;
  }

  players = [];

  players.push({
    name: name,
    role: "",
    alive: true
  });

  for (let i = 2; i <= count; i++) {

    players.push({
      name: "Player " + i,
      role: "",
      alive: true
    });

  }

  assignRoles();

  showRole();
}

function assignRoles() {

  let rolePool = [...fixedRoles];

  while (rolePool.length < players.length) {
    rolePool.push("Innocent");
  }

  rolePool.sort(() => Math.random() - 0.5);

  for (let i = 0; i < players.length; i++) {
    players[i].role = rolePool[i];
  }

  myRole = players[0].role;
}

function showRole() {

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("roleScreen")
    .classList.remove("hidden");

  const roleElement =
    document.getElementById("role");

  const description =
    document.getElementById("roleDescription");

  roleElement.textContent = myRole;

  if (myRole === "Killer") {

    roleElement.className = "role bad";

    description.innerHTML =
      "🔪 You are a <b>Killer</b>.<br><br>" +
      "Work with the other Killers and eliminate the good players.";

  }

  else if (myRole === "Detective") {

    roleElement.className = "role good";

    description.innerHTML =
      "🔎 You are the <b>Detective</b>.<br><br>" +
      "Investigate one player to discover whether they are Good or Bad.";

  }

  else if (myRole === "Doctor") {

    roleElement.className = "role good";

    description.innerHTML =
      "🩺 You are the <b>Doctor</b>.<br><br>" +
      "You have one Save power and one Kill power.";

  }

  else if (myRole === "Fool") {

    roleElement.className = "role special";

    description.innerHTML =
      "🤡 You are the <b>Fool</b>.<br><br>" +
      "<b>Your goal is to get yourself lynched.</b><br><br>" +
      "If the players vote you out, you win.";

  }

  else if (myRole === "Challenger") {

    roleElement.className = "role special";

    description.innerHTML =
      "⚔️ You are the <b>Challenger</b>.<br><br>" +
      "Before voting, challenge one player.<br><br>" +
      "Challenge a Killer → the Killer dies.<br>" +
      "Challenge Good, Innocent, or Fool → you die.";

  }

  else {

    roleElement.className = "role good";

    description.innerHTML =
      "👤 You are <b>Innocent</b>.<br><br>" +
      "Find the Killers and survive.";

  }
}

function showGame() {

  document
    .getElementById("roleScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  renderPlayers();

  addLog("🌙 Night has begun.");

  updatePhase();
}

function renderPlayers() {

  const list =
    document.getElementById("players");

  list.innerHTML = "";

  players.forEach((player, index) => {

    const div =
      document.createElement("div");

    div.className = "player";

    let status =
      player.alive ? "🟢 Alive" : "💀 Eliminated";

    div.innerHTML =
      "<b>" +
      player.name +
      "</b><br>" +
      status;

    list.appendChild(div);
  });
}

function updatePhase() {

  const title =
    document.getElementById("phaseTitle");

  const text =
    document.getElementById("phaseText");

  if (phase === "night") {

    title.textContent = "🌙 Night Phase";

    if (myRole === "Killer") {

      text.textContent =
        "Choose a player to eliminate.";

      showAction(
        "🔪 Killer Action",
        "Choose your target.",
        "killer"
      );

    }

    else if (myRole === "Detective") {

      text.textContent =
        "Choose one player to investigate.";

      showAction(
        "🔎 Detective Investigation",
        "Find out whether the player is Good or Bad.",
        "detective"
      );

    }

    else if (myRole === "Doctor") {

      text.textContent =
        "You have one Save and one Kill power.";

      showDoctorActions();

    }

    else {

      text.textContent =
        "Stay quiet and survive the night.";

      hideAction();

    }

  }

  else if (phase === "challenge") {

    title.textContent = "⚔️ Challenger Phase";

    text.textContent =
      "The Challenger may challenge one living player before voting.";

    if (myRole === "Challenger") {

      showAction(
        "⚔️ Challenge",
        "Choose a living player to challenge.",
        "challenger"
      );

    } else {

      hideAction();

    }

  }

  else {

    title.textContent = "☀️ Day Phase";

    text.textContent =
      "Discuss who you think is a Killer and vote.";

    hideAction();
  }
}

function showAction(title, text, type) {

  const card =
    document.getElementById("actionCard");

  document.getElementById("actionTitle")
    .textContent = title;

  document.getElementById("actionText")
    .textContent = text;

  const targets =
    document.getElementById("actionTargets");

  targets.innerHTML = "";

  selectedTarget = null;

  players.forEach((player, index) => {

    if (!player.alive || index === 0) return;

    const button =
      document.createElement("button");

    button.className = "target";

    button.textContent = player.name;

    button.onclick = function() {

      selectedTarget = index;

      document
        .querySelectorAll(".target")
        .forEach(x => x.classList.remove("selected"));

      button.classList.add("selected");

    };

    targets.appendChild(button);
  });

  document
    .getElementById("actionButton")
    .dataset.type = type;

  card.classList.remove("hidden");
}

function hideAction() {

  document
    .getElementById("actionCard")
    .classList.add("hidden");
}

function showDoctorActions() {

  const card =
    document.getElementById("actionCard");

  const targets =
    document.getElementById("actionTargets");

  document.getElementById("actionTitle")
    .textContent = "🩺 Doctor Powers";

  document.getElementById("actionText")
    .textContent =
    "You may use one Save and one Kill.";

  targets.innerHTML = "";

  if (!doctorSaveUsed) {

    const save =
      document.createElement("button");

    save.textContent = "🛡️ Use Save";

    save.onclick = function() {

      doctorSaveUsed = true;

      addLog("🩺 Doctor used the Save power.");

      alert("Save power used.");

    };

    targets.appendChild(save);
  }

  if (!doctorKillUsed) {

    const kill =
      document.createElement("button");

    kill.textContent = "☠️ Use Kill";

    kill.onclick = function() {

      showAction(
        "☠️ Doctor Kill",
        "Choose a player to eliminate.",
        "doctorKill"
      );

    };

    targets.appendChild(kill);
  }

  card.classList.remove("hidden");
}

function confirmAction() {

  const type =
    document.getElementById("actionButton")
      .dataset.type;

  if (selectedTarget === null) {

    alert("Choose a player first.");

    return;
  }

  const target =
    players[selectedTarget];

  if (!target || !target.alive) {

    alert("That player is no longer alive.");

    return;
  }

  if (type === "killer") {

    addLog(
      "🔪 Killer selected " +
      target.name +
      " as a target."
    );

    alert(
      "Target selected: " +
      target.name
    );

  }

  else if (type === "detective") {

    const alignment =
      isBad(target.role) ? "BAD" : "GOOD";

    addLog(
      "🔎 Detective investigated " +
      target.name +
      "."
    );

    alert(
      target.name +
      " is " +
      alignment +
      "."
    );

  }

  else if (type === "doctorKill") {

    doctorKillUsed = true;

    target.alive = false;

    addLog(
      "☠️ Doctor used the Kill power."
    );

    renderPlayers();

    alert(
      target.name +
      " has been eliminated."
    );

    hideAction();
  }

  else if (type === "challenger") {

    resolveChallenge(selectedTarget);

  }
}

function resolveChallenge(index) {

  const target =
    players[index];

  if (!target || !target.alive) return;

  if (target.role === "Killer") {

    target.alive = false;

    addLog(
      "⚔️ The Challenger successfully found a Killer!"
    );

    alert(
      "The Challenger was correct. " +
      target.name +
      " was a Killer and has been eliminated."
    );

  }

  else {

    players[0].alive = false;

    addLog(
      "⚔️ The Challenger challenged the wrong player."
    );

    alert(
      "The Challenger was wrong and has been eliminated."
    );
  }

  renderPlayers();

  hideAction();

  phase = "day";

  updatePhase();
}

function isBad(role) {

  return role === "Killer";
}

function addLog(message) {

  const log =
    document.getElementById("log");

  const entry =
    document.createElement("div");

  entry.innerHTML =
    message + "<hr>";

  log.prepend(entry);
}

</script>

</body>
</html>
